plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.kapusta.shiptracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.kapusta.shiptracker"
        minSdk 24
        targetSdk 34
        versionCode 361
        versionName "3.5.11"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "requests==2.31.0"
            install "websockets==12.0"
        }
    }
}
